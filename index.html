<!DOCTYPE html>
<html lang="de">
<head>

  <title>SCAN.SeWWWeS.NET v1.0.12 SUPREME - Single-Screen USP Scanner Cockpit</title>

  <!-- jsQR CDN fuer On-Device QR-Dekodierung -->

  <style>
    :root {
      --bg-dark: #040b14;
      --card-bg: rgba(6, 18, 33, 0.85);
      --gold: #FFD700;
      --emerald: #00FF66;
      --skyblue: #00BFFF;
      --amber: #FFA500;
      --danger: #FF3366;
      --border-glow: rgba(0, 255, 102, 0.3);
      --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-dark);
      color: #ffffff;
      font-family: var(--font-family);
      font-size: 14px;
      display: flex;
      flex-direction: column;
    }

    /* TELEMETRIE ROOF - GOOGLE SINGLE-SCREEN ROOF */
    .spcl-telemetry-roof {
      width: 100%;
      background: linear-gradient(180deg, rgba(0, 191, 255, 0.15) 0%, rgba(4, 11, 20, 0.95) 100%);
      border-bottom: 1.5px solid var(--border-glow);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      z-index: 100;
      flex-shrink: 0;
    }

    .roof-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .roof-logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--gold);
      box-shadow: 0 0 10px var(--gold);
    }

    .roof-title {
      font-weight: 900;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .roof-title span {
      color: var(--skyblue);
      text-shadow: 0 0 10px rgba(0, 191, 255, 0.6);
    }

    .roof-badge-family {
      font-size: 0.72rem;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .roof-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-roof-action {
      background: rgba(0, 255, 102, 0.12);
      border: 1px solid var(--emerald);
      color: var(--emerald);
      padding: 5px 10px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-roof-action:hover {
      background: var(--emerald);
      color: #000;
      box-shadow: 0 0 12px var(--emerald);
    }

    .btn-roof-gateway {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.2) 0%, rgba(255, 165, 0, 0.2) 100%);
      border: 1px solid var(--gold);
      color: var(--gold);
    }

    .btn-roof-gateway:hover {
      background: var(--gold);
      color: #000;
      box-shadow: 0 0 12px var(--gold);
    }

    /* MAIN SINGLE SCREEN CONTAINER */
    .viewport-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    /* MODE SELECTOR TABS */
    .mode-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex-shrink: 0;
    }

    .mode-tab {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #888;
      padding: 10px;
      border-radius: 12px;
      text-align: center;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .mode-tab.active {
      background: linear-gradient(135deg, rgba(0, 255, 102, 0.2) 0%, rgba(0, 191, 255, 0.2) 100%);
      border: 1.5px solid var(--emerald);
      color: #fff;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
    }

    /* CAMERA VIEWER BOX */
    .camera-card {
      flex: 1;
      background: #000;
      border: 1.5px solid var(--border-glow);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
    }

    #video-element {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #canvas-element {
      display: none;
    }

    /* SCANNER OVERLAYS */
    .scan-overlay-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      border: 2px dashed var(--emerald);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.4), inset 0 0 30px rgba(0, 255, 102, 0.2);
      pointer-events: none;
      animation: pulseFrame 2s infinite ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes pulseFrame {
      0%, 100% { border-color: var(--emerald); box-shadow: 0 0 20px rgba(0, 255, 102, 0.3); }
      50% { border-color: var(--skyblue); box-shadow: 0 0 35px rgba(0, 191, 255, 0.6); }
    }

    /* BIOMETRIC GOLD OVAL */
    .bdr-gold-oval {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      width: 180px;
      height: 240px;
      border: 3px solid var(--gold);
      border-radius: 50% 50% 45% 45%;
      box-shadow: 0 0 30px var(--gold), inset 0 0 20px rgba(255, 215, 0, 0.3);
      pointer-events: none;
      transition: all 0.3s ease;
      display: none;
    }

    .bdr-gold-oval.verified {
      border-color: #00FF80 !important;
      box-shadow: 0 0 50px #00FF80, inset 0 0 30px rgba(0, 255, 128, 0.5) !important;
      animation: bdrSuccessPulse 0.6s ease-in-out;
    }

    @keyframes bdrSuccessPulse {
      0% { transform: translate(-50%, -55%) scale(0.95); }
      50% { transform: translate(-50%, -55%) scale(1.08); }
      100% { transform: translate(-50%, -55%) scale(1); }
    }

    /* CAMERA CONTROLS FLOATING BAR */
    .cam-controls-bar {
      position: absolute;
      bottom: 12px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .btn-cam-control {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 8px 14px;
      border-radius: 25px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .btn-cam-control:hover {
      background: rgba(0, 255, 102, 0.2);
      border-color: var(--emerald);
      color: var(--emerald);
    }

    /* RESULT PANEL - SPCL ECHTHEITS-MATRIX */
    .result-panel {
      background: var(--card-bg);
      border: 1.5px solid var(--border-glow);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .result-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }

    .badge-stufen-1 {
      background: rgba(0, 255, 102, 0.15);
      border: 1px solid var(--emerald);
      color: var(--emerald);
    }

    .badge-stufen-2 {
      background: rgba(255, 165, 0, 0.15);
      border: 1px solid var(--amber);
      color: var(--amber);
    }

    .result-url-display {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 12px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.82rem;
      color: #FFD700;
      word-break: break-all;
      max-height: 48px;
      overflow-y: auto;
    }

    /* ACTION BUTTONS GRID */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .btn-action {
      padding: 9px 10px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: none;
      text-decoration: none;
    }

    .btn-open {
      background: linear-gradient(135deg, #00FF66 0%, #00B347 100%);
      color: #041208;
    }

    .btn-copy {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .btn-save-bookmark {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.2) 0%, rgba(255, 165, 0, 0.2) 100%);
      border: 1px solid var(--gold);
      color: var(--gold);
    }

    .btn-seal-request {
      background: linear-gradient(135deg, rgba(0, 191, 255, 0.2) 0%, rgba(0, 102, 255, 0.2) 100%);
      border: 1px solid var(--skyblue);
      color: var(--skyblue);
      grid-column: span 2;
    }

    /* MODAL LESEZEICHEN */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 480px;
      background: #061221;
      border: 1.5px solid var(--gold);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 80vh;
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
      padding-bottom: 8px;
    }

    .modal-title {
      font-weight: 900;
      color: var(--gold);
      font-size: 1rem;
    }

    .modal-close {
      background: none;
      border: none;
      color: #aaa;
      font-size: 1.4rem;
      cursor: pointer;
    }

    .bookmark-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      max-height: 50vh;
    }

    .bookmark-item {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 0.8rem;
      color: #fff;
      word-break: break-all;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- TELEMETRIE ROOF -->
  <div class="spcl-telemetry-roof">

  </div>

  <!-- MAIN SINGLE SCREEN VIEWPORT -->
  <div class="viewport-container">

    <!-- MODE SELECTOR -->
    <div class="mode-selector">
      <div id="tab-qr" class="mode-tab active" onclick="switchScanMode('qr')">
        📷 1. UNIVERSAL QR SCAN
      </div>

    <!-- CAMERA VIEWER CARD -->
    <div class="camera-card">

      <!-- QR SEARCH FRAME -->

      <!-- BDR GOLD OVAL -->
      <div id="bio-oval" class="bdr-gold-oval"></div>

      <!-- CAMERA CONTROLS -->
      <div class="cam-controls-bar">
        <button class="btn-cam-control" onclick="toggleCameraFacing()">🔄 KAMERA WECHSELN</button>
        <button class="btn-cam-control" onclick="triggerNativeNomoScan()">📱 NOMO NATIVE SCAN</button>
      </div>
    </div>

    <!-- RESULT PANEL / SPCL ECHTHEITS-MATRIX -->
    <div class="result-panel">
      <div id="status-badge" class="result-badge badge-stufen-2">
        ⚠️ STUFE 2: UNVERIFIZIERTER CODE / STANDBY
      </div>

      <div id="scanned-url-display" class="result-url-display">
        Warten auf QR-Code Scan... Halten Sie ein Siegel oder einen Link vor die Kamera.

      <div class="action-grid">
        <button class="btn-action btn-open" onclick="openScannedTargetUrl()">🔗 ZIEL ÖFFNEN</button>
        <button class="btn-action btn-copy" onclick="copyScannedContent()">📋 INHALT KOPIEREN</button>
        <button class="btn-action btn-save-bookmark" onclick="saveCurrentBookmark()">📌 IN MYQR SPEICHERN</button>
        <button class="btn-action btn-seal-request" onclick="requestOfficialScanMeSeal()">🛡️ DIESEN CODE ALS SEWWWES SPCL-SIEGEL SCHÜTZEN</button>
      </div>
    </div>

  </div>

  <!-- MODAL: MYQR LESEZEICHEN MANAGER -->
  <div id="modal-bookmarks" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📚 IHRE MYQR LESEZEICHEN-LISTE</div>
        <button class="modal-close" onclick="closeMyQrBookmarksModal()">&times;</button>
      </div>
      <div id="bookmark-list-container" class="bookmark-list">
        <!-- Dynamisch befuellt -->
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT CORE LOGIK v1.0.12 SUPREME -->
  <script>
    let activeFacing = "environment";
    let activeStream = null;
    let scanMode = "qr"; // 'qr' or 'biometric'
    let lastScannedContent = "";
    let audioCtx = null;

    // WEB AUDIO CHIMES
    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playScanSuccessChime() {
      try {
        initAudioContext();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
        osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.12); // A6
        gain.gain.setValueAtTime(0.95, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.16);
      } catch(e){}
    }

    function playBiometricSuccessFanfare() {
      try {
        initAudioContext();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.value = freq;
          const startTime = audioCtx.currentTime + (idx * 0.08);
          gain.gain.setValueAtTime(0.9, startTime);
          gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.22);
        });
      } catch(e){}
    }

    // CAMERA FEEDER
    async function startCameraFeeder() {
      stopCameraFeeder();
      const video = document.getElementById("video-element");
      try {
        activeStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: activeFacing, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = activeStream;
        requestAnimationFrame(processFrameLoop);
      } catch(e) {
        console.error("Kamerafehler:", e);
      }
    }

    function stopCameraFeeder() {
      if (activeStream) {
        activeStream.getTracks().forEach(track => track.stop());
        activeStream = null;
      }
    }

    function toggleCameraFacing() {
      activeFacing = (activeFacing === "environment") ? "user" : "environment";
      startCameraFeeder();
    }

    function switchScanMode(mode) {
      scanMode = mode;
      document.getElementById("tab-qr").classList.toggle("active", mode === "qr");
      document.getElementById("tab-bio").classList.toggle("active", mode === "biometric");
      document.getElementById("qr-frame").style.display = (mode === "qr") ? "flex" : "none";
      document.getElementById("bio-oval").style.display = (mode === "biometric") ? "block" : "none";
      
      if (mode === "biometric" && activeFacing !== "user") {
        activeFacing = "user";
        startCameraFeeder();
      }
    }

    // PROCESS FRAME LOOP (Canvas + jsQR)
    function processFrameLoop() {
      const video = document.getElementById("video-element");
      const canvas = document.getElementById("canvas-element");
      
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        if (scanMode === "qr") {
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          if (window.jsQR) {
            const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });
            if (code && code.data && code.data !== lastScannedContent) {
              lastScannedContent = code.data;
              handleDetectedScanResult(code.data);
            }
          }
        } else if (scanMode === "biometric") {
          // Simulated Sovereign Biometric Liveness Match
          if (Math.random() < 0.02) { // Proof of life trigger
            handleBiometricSuccess();
          }
        }
      }
      requestAnimationFrame(processFrameLoop);
    }

    function handleDetectedScanResult(val) {
      playScanSuccessChime();
      const display = document.getElementById("scanned-url-display");
      const badge = document.getElementById("status-badge");
      display.innerText = val;

      if (val.includes("sewwwes.net") || val.includes("smartearthworld") || val.includes("SID:")) {
        badge.className = "result-badge badge-stufen-1";
        badge.innerText = "🟢 STUFE 1: SPCL VERIFIZIERTES EIGENSIEGEL";
      } else {
        badge.className = "result-badge badge-stufen-2";
        badge.innerText = "⚠️ STUFE 2: EXTERNER UNVERIFIZIERTER CODE";
      }
    }

    function handleBiometricSuccess() {
      playBiometricSuccessFanfare();
      const oval = document.getElementById("bio-oval");
      oval.classList.add("verified");
      const badge = document.getElementById("status-badge");
      badge.className = "result-badge badge-stufen-1";
      badge.innerText = "🟢 BDR BIOMETRIE LEGITIMATION ERFOLGREICH";
      
      setTimeout(() => {
        oval.classList.remove("verified");
      }, 3000);
    }

    // ACTIONS
    function openScannedTargetUrl() {
      if (!lastScannedContent) {
        alert("Bitte zuerst einen QR-Code scannen!");
        return;
      }
      if (lastScannedContent.startsWith("http://") || lastScannedContent.startsWith("https://")) {
        window.open(lastScannedContent, "_blank");
      } else {
        alert("Inhalt: " + lastScannedContent);
      }
    }

    function copyScannedContent() {
      if (!lastScannedContent) {
        alert("Kein Inhalt zum Kopieren vorhanden!");
        return;
      }
      navigator.clipboard.writeText(lastScannedContent).then(() => {
        alert("📋 In Zwischenablage kopiert:

" + lastScannedContent);
      });
    }

    function saveCurrentBookmark() {
      if (!lastScannedContent) {
        alert("Bitte zuerst einen QR-Code scannen!");
        return;
      }
      try {
        let bookmarks = JSON.parse(localStorage.getItem("sewwwes_myqr_bookmarks") || "[]");
        if (!bookmarks.includes(lastScannedContent)) {
          bookmarks.push(lastScannedContent);
          localStorage.setItem("sewwwes_myqr_bookmarks", JSON.stringify(bookmarks));
          alert("📌 Erfurchtsvoll in Ihren MyQR-Lesezeichen gespeichert!");
        } else {
          alert("ℹ️ Dieser Code ist bereits in Ihren MyQR-Lesezeichen enthalten.");
        }
      } catch(e){}
    }

    function requestOfficialScanMeSeal() {
      const url = lastScannedContent || window.location.href;
      const msg = encodeURIComponent("Hallo Mentor Dirk & SmartEarthFamily Team,

ich möchte folgenden Code offiziell als ScanMe.NFT Siegel / CID im SeWWWeS.NET Ökosystem zertifizieren lassen:

ZIEL: " + url);
      window.open("mailto:seal@sewwwes.net?subject=" + encodeURIComponent("ScanMe.NFT Siegel Anfrage") + "&body=" + msg, "_blank");
    }

    function openMyQrBookmarksModal() {
      const modal = document.getElementById("modal-bookmarks");
      const container = document.getElementById("bookmark-list-container");
      container.innerHTML = "";
      
      try {
        let bookmarks = JSON.parse(localStorage.getItem("sewwwes_myqr_bookmarks") || "[]");
        if (bookmarks.length === 0) {
          container.innerHTML = "<div style='color:#aaa; padding:10px;'>Keine Lesezeichen gespeichert.</div>";
        } else {
          bookmarks.forEach((bm, idx) => {
            const item = document.createElement("div");
            item.className = "bookmark-item";
            item.innerHTML = `<span>${idx + 1}. ${bm}</span> <button style='background:var(--emerald); color:#000; border:none; padding:4px 8px; border-radius:6px; cursor:pointer; font-weight:bold;' onclick='window.open("${bm}", "_blank")'>Öffnen</button>`;
            container.appendChild(item);
          });
        }
      } catch(e){}
      
      modal.style.display = "flex";
    }

    function closeMyQrBookmarksModal() {
      document.getElementById("modal-bookmarks").style.display = "none";
    }

    function triggerNativeNomoScan() {
      if (window.nomo && typeof window.nomo.qrScan === "function") {
        window.nomo.qrScan().then(res => {
          if (res && res.qrCode) {
            lastScannedContent = res.qrCode;
            handleDetectedScanResult(res.qrCode);
          }
        });
      } else {
        alert("Nomo Native Bridge nicht verfügbar. Verwende On-Device Kamera.");
      }
    }

    function navigateToMasterGateway() {
      window.location.href = "https://sewwwes.net/";
    }

    // INIT ON LOAD
    window.addEventListener("DOMContentLoaded", () => {
      startCameraFeeder();
      document.body.addEventListener("click", initAudioContext, { once: true });
    });
  </script>
</body>
</html>
